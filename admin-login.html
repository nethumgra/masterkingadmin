<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TUTU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        'tutu-pink': { DEFAULT: '#db2777', dark: '#be185d', light: '#fbcfe8' }
                    }
                }
            }
        }
    </script>
    <style>
        .bg-pattern {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .login-card { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .btn-login { transition: all 0.3s ease; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(219,39,119,0.4); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #db2777; }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center font-sans p-4">

    <div class="login-card bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        
        <!-- Top gradient banner -->
        <div class="bg-gradient-to-r from-tutu-pink to-purple-600 p-8 text-center">
            <div class="w-20 h-20 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-white/40">
                <i class="fa fa-shield-halved text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">TUTU Admin</h1>
            <p class="text-pink-100 text-sm font-medium mt-1 uppercase tracking-widest">Secure Control Panel</p>
        </div>

        <!-- Form area -->
        <div class="p-8">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa fa-envelope text-tutu-pink mr-1"></i> Email Address
                    </label>
                    <input type="email" id="email"
                        class="w-full p-3.5 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-tutu-pink bg-pink-50/30 transition-all text-gray-800 placeholder-gray-400"
                        placeholder="admin@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa fa-lock text-tutu-pink mr-1"></i> Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password"
                            class="w-full p-3.5 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-tutu-pink bg-pink-50/30 transition-all text-gray-800 pr-12"
                            placeholder="••••••••" required>
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-tutu-pink transition-colors">
                            <i id="eye-icon" class="fa fa-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm text-center p-3.5 rounded-xl border border-red-100 flex items-center gap-2">
                    <i class="fa fa-circle-exclamation"></i>
                    <span id="error-text">Invalid credentials</span>
                </div>

                <button type="submit" id="submit-btn"
                    class="btn-login w-full bg-gradient-to-r from-tutu-pink to-purple-600 text-white p-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                    <i class="fa fa-right-to-bracket"></i>
                    <span id="btn-text">Login Securely</span>
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-6">
                &copy; 2025 TUTU Store &nbsp;·&nbsp; Admin Access Only
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, checkAdminAuth } from "./common.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa fa-eye-slash text-lg';
            } else {
                pwd.type = 'password';
                icon.className = 'fa fa-eye text-lg';
            }
        }
        window.togglePassword = togglePassword;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btn.classList.add('opacity-80');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                btnText.textContent = 'Redirecting...';
                checkAdminAuth();
            } catch (error) {
                let msg = 'Invalid email or password.';
                if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Please try again later.';
                if (error.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
                errorText.textContent = msg;
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btnText.textContent = 'Login Securely';
                btn.classList.remove('opacity-80');
            }
        });

        checkAdminAuth(false);
    </script>
</body>
</html>
