<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - TUTU Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        'tutu-pink': { DEFAULT: '#db2777', dark: '#be185d', light: '#fbcfe8' },
                        'ai-purple': '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #db2777; }
        .cat-card { transition: all 0.2s ease; }
        .cat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(219,39,119,0.12); }
        .sub-panel { animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        .sub-row:hover { background: #fdf2f8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="sidebar-container"></div>

    <main class="md:ml-64 p-8 mt-12 md:mt-0">

        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Categories</h1>
                <p class="text-sm text-gray-500">Manage product categories and subcategories</p>
            </div>
            <button onclick="openAddModal()" class="bg-tutu-pink text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-tutu-pink-dark transition flex items-center gap-2">
                <i class="fa fa-plus"></i> Add Category
            </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-tutu-pink">
                <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Total Categories</p>
                <h2 class="text-3xl font-bold mt-1 text-gray-800" id="count-categories">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-purple-500">
                <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Active</p>
                <h2 class="text-3xl font-bold mt-1 text-gray-800" id="count-active">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-blue-400">
                <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Subcategories</p>
                <h2 class="text-3xl font-bold mt-1 text-gray-800" id="count-subs">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-orange-400">
                <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Total Products</p>
                <h2 class="text-3xl font-bold mt-1 text-gray-800" id="count-products">0</h2>
            </div>
        </div>

        <!-- Search -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 flex gap-3 items-center">
            <div class="relative flex-grow">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="cat-search" placeholder="Search categories..."
                    class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-tutu-pink"
                    oninput="renderCategories()">
            </div>
            <select id="cat-filter" onchange="renderCategories()"
                class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-tutu-pink">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <!-- Categories Grid -->
        <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fas fa-spinner fa-spin text-3xl mb-3 block text-tutu-pink"></i>
                Loading categories...
            </div>
        </div>

    </main>

    <!-- Add/Edit Category Modal -->
    <div id="cat-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
            <div class="bg-gradient-to-r from-tutu-pink to-purple-600 p-5 rounded-t-2xl flex justify-between items-center">
                <h3 class="text-white font-bold text-lg flex items-center gap-2">
                    <i class="fa fa-tags"></i>
                    <span id="modal-title">Add Category</span>
                </h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 transition">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="edit-cat-id">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Category Name *</label>
                    <input type="text" id="cat-name" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition" placeholder="e.g., Electronics">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Description</label>
                    <textarea id="cat-desc" rows="2" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition resize-none" placeholder="Short description..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Icon (Font Awesome class)</label>
                    <div class="flex gap-2">
                        <input type="text" id="cat-icon" class="flex-grow border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition" placeholder="fa-laptop">
                        <div class="w-12 h-12 bg-pink-50 rounded-xl flex items-center justify-center text-tutu-pink text-xl border-2 border-pink-100">
                            <i id="preview-icon" class="fa fa-tag"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Status</label>
                    <div class="flex gap-3">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="cat-status" value="active" checked class="text-tutu-pink"> Active
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="cat-status" value="inactive" class="text-tutu-pink"> Inactive
                        </label>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeModal()" class="flex-1 border-2 border-gray-200 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-50 transition">Cancel</button>
                    <button onclick="saveCategory()" class="flex-1 bg-tutu-pink text-white py-3 rounded-xl font-bold hover:bg-tutu-pink-dark transition shadow-md">Save Category</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Subcategory Modal -->
    <div id="sub-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="bg-gradient-to-r from-purple-500 to-tutu-pink p-5 rounded-t-2xl flex justify-between items-center">
                <h3 class="text-white font-bold text-lg flex items-center gap-2">
                    <i class="fa fa-sitemap"></i>
                    <span id="sub-modal-title">Add Subcategory</span>
                </h3>
                <button onclick="closeSubModal()" class="text-white/80 hover:text-white w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 transition">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="edit-sub-id">
                <input type="hidden" id="edit-sub-parent-id">
                <input type="hidden" id="edit-sub-parent-path">
                <div class="bg-pink-50 rounded-xl p-3 flex items-center gap-2 border border-pink-100">
                    <i class="fa fa-folder text-tutu-pink"></i>
                    <span class="text-sm font-semibold text-gray-700">Parent: <span id="sub-parent-name" class="text-tutu-pink"></span></span>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Subcategory Name *</label>
                    <input type="text" id="sub-name" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition" placeholder="e.g., Smartphones">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Description</label>
                    <input type="text" id="sub-desc" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition" placeholder="Optional description">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Icon</label>
                    <div class="flex gap-2">
                        <input type="text" id="sub-icon" class="flex-grow border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-tutu-pink transition" placeholder="fa-mobile">
                        <div class="w-12 h-12 bg-purple-50 rounded-xl flex items-center justify-center text-purple-500 text-xl border-2 border-purple-100">
                            <i id="sub-preview-icon" class="fa fa-tag"></i>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeSubModal()" class="flex-1 border-2 border-gray-200 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-50 transition">Cancel</button>
                    <button onclick="saveSubCategory()" class="flex-1 bg-gradient-to-r from-purple-500 to-tutu-pink text-white py-3 rounded-xl font-bold hover:shadow-lg transition">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, checkAdminAuth, renderSidebar, showToast } from './common.js';
        import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        checkAdminAuth();
        renderSidebar('categories');

        let allCategories = [];
        let subCategoriesCache = {}; // { catId: [subcat, ...] }
        let expandedCatId = null;

        const CATEGORY_PATHS = [
            'artifacts/default-app-id/public/data/categories',
            'categories',
        ];
        const PRIMARY_CAT_PATH = 'artifacts/default-app-id/public/data/categories';

        // ── Load Categories ──────────────────────────────────────────
        async function loadCategories() {
            allCategories = [];
            for (const path of CATEGORY_PATHS) {
                try {
                    const parts = path.split('/');
                    const snap = await getDocs(collection(db, ...parts));
                    if (!snap.empty) {
                        allCategories = [...allCategories, ...snap.docs.map(d => ({ id: d.id, _path: path, ...d.data() }))];
                    }
                } catch(e) {}
            }
            updateStats();
            renderCategories();
        }

        // ── Load Subcategories for a category ────────────────────────
        async function loadSubCategories(catId, catPath) {
            const subPath = [...catPath.split('/'), catId, 'subcategories'];
            try {
                const snap = await getDocs(collection(db, ...subPath));
                subCategoriesCache[catId] = snap.docs.map(d => ({ id: d.id, _subPath: subPath.join('/'), ...d.data() }));
            } catch(e) {
                subCategoriesCache[catId] = [];
            }
            return subCategoriesCache[catId];
        }

        function updateStats() {
            document.getElementById('count-categories').textContent = allCategories.length;
            document.getElementById('count-active').textContent = allCategories.filter(c => c.status === 'active').length;
            const totalSubs = Object.values(subCategoriesCache).reduce((s, a) => s + a.length, 0);
            document.getElementById('count-subs').textContent = totalSubs;
            const total = allCategories.reduce((s, c) => s + (c.productCount || 0), 0);
            document.getElementById('count-products').textContent = total;
        }

        // ── Render Categories Grid ───────────────────────────────────
        window.renderCategories = function() {
            const search = document.getElementById('cat-search').value.toLowerCase();
            const filter = document.getElementById('cat-filter').value;
            const cats = allCategories.filter(c => {
                const matchSearch = (c.name || '').toLowerCase().includes(search) || (c.description || '').toLowerCase().includes(search);
                const matchFilter = filter === 'all' || c.status === filter;
                return matchSearch && matchFilter;
            });

            const grid = document.getElementById('categories-grid');
            if (cats.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400">
                    <i class="fa fa-folder-open text-5xl mb-3 block text-pink-200"></i>
                    <p class="font-semibold">No categories found</p>
                    <p class="text-sm mt-1">Click "+ Add Category" to get started</p>
                </div>`;
                return;
            }

            grid.innerHTML = cats.map(c => {
                const subs = subCategoriesCache[c.id] || [];
                const isExpanded = expandedCatId === c.id;
                return `
                <div class="cat-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden" id="card-${c.id}">
                    <!-- Main category row -->
                    <div class="p-5 relative">
                        <div class="flex items-start gap-4">
                            <div class="w-12 h-12 rounded-xl bg-pink-50 flex items-center justify-center text-tutu-pink text-xl flex-shrink-0 border border-pink-100">
                                <i class="fa ${c.icon || 'fa-tag'}"></i>
                            </div>
                            <div class="flex-grow min-w-0 pr-16">
                                <h3 class="font-bold text-gray-800 text-base truncate">${c.name || 'Unnamed'}</h3>
                                <p class="text-xs text-gray-500 mt-0.5 truncate">${c.description || 'No description'}</p>
                                <div class="flex items-center gap-2 mt-2 flex-wrap">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-full ${c.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                                        ${c.status === 'active' ? '● Active' : '○ Inactive'}
                                    </span>
                                    <span class="text-xs text-gray-400">${c.productCount || 0} products</span>
                                    <span class="text-xs font-semibold text-purple-500">${subs.length > 0 ? subs.length + ' subcategories' : 'No subcategories'}</span>
                                </div>
                            </div>
                        </div>
                        <!-- Action buttons -->
                        <div class="absolute top-4 right-4 flex gap-1">
                            <button onclick="toggleSubPanel('${c.id}', '${c._path}')" 
                                class="w-8 h-8 rounded-lg ${isExpanded ? 'bg-purple-100 text-purple-600' : 'bg-purple-50 text-purple-400 hover:bg-purple-100 hover:text-purple-600'} transition flex items-center justify-center" title="View Subcategories">
                                <i class="fa fa-sitemap text-xs"></i>
                            </button>
                            <button onclick="editCategory('${c.id}')" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-500 hover:bg-blue-100 transition flex items-center justify-center" title="Edit">
                                <i class="fa fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteCategory('${c.id}', '${(c.name || '').replace(/'/g,"\\'")}', '${c._path}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 transition flex items-center justify-center" title="Delete">
                                <i class="fa fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Subcategories panel (expandable) -->
                    <div id="sub-panel-${c.id}" class="${isExpanded ? 'sub-panel' : 'hidden'} border-t border-gray-100 bg-gray-50/50">
                        <div class="px-5 py-3 flex items-center justify-between">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Subcategories</p>
                            <button onclick="openAddSubModal('${c.id}', '${(c.name || '').replace(/'/g,"\\'")}', '${c._path}')"
                                class="text-xs bg-purple-500 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-purple-600 transition flex items-center gap-1">
                                <i class="fa fa-plus text-[10px]"></i> Add Sub
                            </button>
                        </div>
                        <div id="sub-list-${c.id}" class="px-4 pb-4 space-y-2">
                            ${subs.length === 0
                                ? `<p class="text-xs text-gray-400 text-center py-3 italic">No subcategories yet. Click "+ Add Sub" to create one.</p>`
                                : subs.map(s => `
                                    <div class="sub-row flex items-center gap-3 bg-white rounded-xl px-3 py-2.5 border border-gray-100 transition">
                                        <div class="w-7 h-7 rounded-lg bg-purple-50 flex items-center justify-center text-purple-400 text-sm flex-shrink-0">
                                            <i class="fa ${s.icon || 'fa-angle-right'}"></i>
                                        </div>
                                        <div class="flex-grow min-w-0">
                                            <p class="font-semibold text-gray-700 text-sm truncate">${s.name || 'Unnamed'}</p>
                                            ${s.description ? `<p class="text-xs text-gray-400 truncate">${s.description}</p>` : ''}
                                        </div>
                                        <div class="flex gap-1 flex-shrink-0">
                                            <button onclick="editSubCategory('${c.id}', '${s.id}', '${c._path}', '${(c.name || '').replace(/'/g,"\\'")}')"
                                                class="w-7 h-7 rounded-lg bg-blue-50 text-blue-400 hover:bg-blue-100 transition flex items-center justify-center">
                                                <i class="fa fa-pen text-[10px]"></i>
                                            </button>
                                            <button onclick="deleteSubCategory('${c.id}', '${s.id}', '${(s.name || '').replace(/'/g,"\\'")}', '${c._path}')"
                                                class="w-7 h-7 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 transition flex items-center justify-center">
                                                <i class="fa fa-trash text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        // ── Toggle Subcategory Panel ─────────────────────────────────
        window.toggleSubPanel = async function(catId, catPath) {
            if (expandedCatId === catId) {
                // Collapse
                expandedCatId = null;
                renderCategories();
                return;
            }
            expandedCatId = catId;
            // Show panel with loading state immediately
            renderCategories();
            // Load subs if not cached
            if (!subCategoriesCache[catId]) {
                document.getElementById(`sub-list-${catId}`).innerHTML = '<p class="text-xs text-gray-400 text-center py-3"><i class="fa fa-spinner fa-spin mr-1 text-purple-400"></i> Loading...</p>';
                await loadSubCategories(catId, catPath);
                updateStats();
                renderCategories();
            }
        };

        // ── Category CRUD ────────────────────────────────────────────
        window.openAddModal = function() {
            document.getElementById('modal-title').textContent = 'Add Category';
            document.getElementById('edit-cat-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-desc').value = '';
            document.getElementById('cat-icon').value = '';
            document.getElementById('preview-icon').className = 'fa fa-tag';
            document.querySelector('input[name="cat-status"][value="active"]').checked = true;
            document.getElementById('cat-modal').classList.remove('hidden');
        };

        window.editCategory = function(id) {
            const c = allCategories.find(x => x.id === id);
            if (!c) return;
            document.getElementById('modal-title').textContent = 'Edit Category';
            document.getElementById('edit-cat-id').value = id;
            document.getElementById('cat-name').value = c.name || '';
            document.getElementById('cat-desc').value = c.description || '';
            document.getElementById('cat-icon').value = c.icon || '';
            document.getElementById('preview-icon').className = `fa ${c.icon || 'fa-tag'}`;
            document.querySelector(`input[name="cat-status"][value="${c.status || 'active'}"]`).checked = true;
            document.getElementById('cat-modal').classList.remove('hidden');
        };

        window.closeModal = function() { document.getElementById('cat-modal').classList.add('hidden'); };

        window.saveCategory = async function() {
            const id = document.getElementById('edit-cat-id').value;
            const name = document.getElementById('cat-name').value.trim();
            if (!name) { showToast('Category name is required!', 'error'); return; }
            const data = {
                name,
                description: document.getElementById('cat-desc').value.trim(),
                icon: document.getElementById('cat-icon').value.trim() || 'fa-tag',
                status: document.querySelector('input[name="cat-status"]:checked').value,
                updatedAt: serverTimestamp()
            };
            try {
                if (id) {
                    const cat = allCategories.find(x => x.id === id);
                    const parts = (cat?._path || PRIMARY_CAT_PATH).split('/');
                    await updateDoc(doc(db, ...parts, id), data);
                    showToast('Category updated!', 'success');
                } else {
                    data.createdAt = serverTimestamp();
                    data.productCount = 0;
                    await addDoc(collection(db, ...PRIMARY_CAT_PATH.split('/')), data);
                    showToast('Category added!', 'success');
                }
                closeModal();
                loadCategories();
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.deleteCategory = async function(id, name, catPath) {
            const result = await Swal.fire({
                icon: 'warning', title: 'Delete Category?',
                text: `"${name}" and all its subcategories will be deleted.`,
                showCancelButton: true, confirmButtonColor: '#db2777',
                confirmButtonText: 'Delete', cancelButtonText: 'Cancel'
            });
            if (!result.isConfirmed) return;
            try {
                const parts = (catPath || PRIMARY_CAT_PATH).split('/');
                await deleteDoc(doc(db, ...parts, id));
                delete subCategoriesCache[id];
                if (expandedCatId === id) expandedCatId = null;
                showToast('Deleted!', 'success');
                loadCategories();
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        };

        // ── Subcategory CRUD ─────────────────────────────────────────
        window.openAddSubModal = function(parentId, parentName, parentPath) {
            document.getElementById('sub-modal-title').textContent = 'Add Subcategory';
            document.getElementById('edit-sub-id').value = '';
            document.getElementById('edit-sub-parent-id').value = parentId;
            document.getElementById('edit-sub-parent-path').value = parentPath;
            document.getElementById('sub-parent-name').textContent = parentName;
            document.getElementById('sub-name').value = '';
            document.getElementById('sub-desc').value = '';
            document.getElementById('sub-icon').value = '';
            document.getElementById('sub-preview-icon').className = 'fa fa-tag';
            document.getElementById('sub-modal').classList.remove('hidden');
        };

        window.editSubCategory = function(parentId, subId, parentPath, parentName) {
            const subs = subCategoriesCache[parentId] || [];
            const s = subs.find(x => x.id === subId);
            if (!s) return;
            document.getElementById('sub-modal-title').textContent = 'Edit Subcategory';
            document.getElementById('edit-sub-id').value = subId;
            document.getElementById('edit-sub-parent-id').value = parentId;
            document.getElementById('edit-sub-parent-path').value = parentPath;
            document.getElementById('sub-parent-name').textContent = parentName;
            document.getElementById('sub-name').value = s.name || '';
            document.getElementById('sub-desc').value = s.description || '';
            document.getElementById('sub-icon').value = s.icon || '';
            document.getElementById('sub-preview-icon').className = `fa ${s.icon || 'fa-tag'}`;
            document.getElementById('sub-modal').classList.remove('hidden');
        };

        window.closeSubModal = function() { document.getElementById('sub-modal').classList.add('hidden'); };

        window.saveSubCategory = async function() {
            const subId    = document.getElementById('edit-sub-id').value;
            const parentId = document.getElementById('edit-sub-parent-id').value;
            const parentPath = document.getElementById('edit-sub-parent-path').value || PRIMARY_CAT_PATH;
            const name = document.getElementById('sub-name').value.trim();
            if (!name) { showToast('Name is required!', 'error'); return; }

            const subColPath = [...parentPath.split('/'), parentId, 'subcategories'];
            const data = {
                name,
                description: document.getElementById('sub-desc').value.trim(),
                icon: document.getElementById('sub-icon').value.trim() || 'fa-angle-right',
                updatedAt: serverTimestamp()
            };

            try {
                if (subId) {
                    await updateDoc(doc(db, ...subColPath, subId), data);
                    showToast('Subcategory updated!', 'success');
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, ...subColPath), data);
                    showToast('Subcategory added!', 'success');
                }
                closeSubModal();
                // Reload subcategories for this parent
                delete subCategoriesCache[parentId];
                await loadSubCategories(parentId, parentPath);
                updateStats();
                renderCategories();
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.deleteSubCategory = async function(parentId, subId, subName, parentPath) {
            const result = await Swal.fire({
                icon: 'warning', title: 'Delete Subcategory?',
                text: `"${subName}" will be deleted.`,
                showCancelButton: true, confirmButtonColor: '#db2777',
                confirmButtonText: 'Delete'
            });
            if (!result.isConfirmed) return;
            try {
                const subColPath = [...(parentPath || PRIMARY_CAT_PATH).split('/'), parentId, 'subcategories'];
                await deleteDoc(doc(db, ...subColPath, subId));
                delete subCategoriesCache[parentId];
                await loadSubCategories(parentId, parentPath || PRIMARY_CAT_PATH);
                updateStats();
                renderCategories();
                showToast('Subcategory deleted!', 'success');
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        };

        // ── Icon previews ────────────────────────────────────────────
        document.getElementById('cat-icon').addEventListener('input', function() {
            document.getElementById('preview-icon').className = `fa ${this.value || 'fa-tag'}`;
        });
        document.getElementById('sub-icon').addEventListener('input', function() {
            document.getElementById('sub-preview-icon').className = `fa ${this.value || 'fa-tag'}`;
        });

        loadCategories();
    </script>
</body>
</html>
